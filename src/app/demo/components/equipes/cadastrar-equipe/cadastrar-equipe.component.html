<div class="card">
    <h4 class="text-900 font-bold mb-4">Cadastro de Equipe</h4>
    <form [formGroup]="equipeForm" (ngSubmit)="salvar()" class="p-fluid grid formgrid">
        
        <div class="field col-12 md:col-6">
            <label for="nome" class="font-bold block mb-2">Nome da Equipe</label>
            <input id="nome" type="text" pInputText formControlName="nome" 
                placeholder="Ex: Equipe de Manutenção Alpha" class="w-full" />
            <small *ngIf="equipeForm.get('nome')?.invalid && equipeForm.get('nome')?.touched" class="p-error">
                Nome da equipe é obrigatório (mínimo 3 caracteres).
            </small>
        </div>

        <div class="field col-12 md:col-6">
            <label for="usuarioId" class="font-bold block mb-2">Encarregado Responsável</label>
            <p-dropdown id="usuarioId" [options]="encarregados" formControlName="usuarioId" 
                optionLabel="nome" optionValue="id" placeholder="Selecione o encarregado" 
                [filter]="true" filterBy="nome" emptyMessage="Nenhum encarregado encontrado" styleClass="w-full">
                <ng-template let-usuario pTemplate="item">
                    <div class="flex align-items-center gap-2">
                        <i class="pi pi-user text-primary"></i>
                        <span>{{ usuario.nome }}</span>
                        <small class="text-500 font-italic" *ngIf="usuario.cargo">({{ usuario.cargo }})</small>
                    </div>
                </ng-template>
            </p-dropdown>
            <small *ngIf="equipeForm.get('usuarioId')?.invalid && equipeForm.get('usuarioId')?.touched" class="p-error">
                Seleção do encarregado é obrigatória.
            </small>
        </div>

        <div class="col-12 mt-4">
            <div class="flex flex-column sm:flex-row justify-content-between align-items-start sm:align-items-center gap-3 mb-4 pb-1">
                <label class="font-bold text-lg m-0">Membros da Equipe</label>
                <p-button label="Adicionar Membro" icon="pi pi-plus" size="small" severity="secondary"
                    [outlined]="true" (onClick)="addMembro()" styleClass="w-full sm:w-auto">
                </p-button>
            </div>

            <div formArrayName="membros" class="flex flex-column gap-3">
                <div *ngFor="let item of membros.controls; let i = index" [formGroupName]="i" 
                    class="grid align-items-center">
                    <div class="col-10 sm:col-11">
                        <input pInputText formControlName="nome" placeholder="Nome do membro da equipe" class="w-full" />
                    </div>
                    <div class="col-2 sm:col-1 flex justify-content-center">
                        <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="removeMembro(i)">
                        </p-button>
                    </div>
                </div>
            </div>

            <div *ngIf="membros.length === 0" class="text-center p-4 border-1 border-dashed border-300 border-round bg-gray-50 mt-2">
                <span class="text-gray-500">Nenhum membro adicionado. Clique em "Adicionar Membro".</span>
            </div>
        </div>

        <div class="col-12 flex flex-column-reverse sm:flex-row justify-content-end gap-2 mt-5">
            <p-button label="Salvar Equipe" icon="pi pi-check" type="submit" styleClass="w-full sm:w-auto"
                [disabled]="equipeForm.invalid || salvando" [loading]="salvando">
            </p-button>
        </div>
    </form>
</div>
